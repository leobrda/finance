<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EDITAR TRANSAÇÃO — BRUT. FINANCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-[#F6F6F2] text-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md border-4 border-black bg-white shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
        <div class="p-6 border-b-4 border-black bg-[#FFE600] flex justify-between items-center">
            <span class="text-2xl font-black tracking-tighter uppercase">EDITAR REGISTRO</span>
            <span class="text-xs font-black uppercase border-2 border-black px-2 py-0.5 bg-white">{{ workspace.name }}</span>
        </div>
        <form method="post" class="p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-black uppercase tracking-wider mb-1">Descrição</label>
                {{ form.description }}
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider mb-1">Valor (R$)</label>
                    {{ form.amount }}
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider mb-1">Data</label>
                    {{ form.transaction_date }}
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider mb-1">Categoria</label>
                    <div class="border-2 border-black">
                        {{ form.category }}
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wider mb-1">Pagamento</label>
                    <div class="border-2 border-black">
                        {{ form.payment_method }}
                    </div>
                </div>
            </div>
            <div>
                <label class="block text-xs font-black uppercase tracking-wider mb-1">Observações</label>
                {{ form.notes }}
            </div>
            <div class="flex gap-3 pt-4 border-t-2 border-black">
                <a href="/dashboard/?workspace={{ workspace.id }}" class="w-1/2 py-3 border-2 border-black text-xs font-black uppercase text-center hover:bg-neutral-100 flex items-center justify-center">
                    Cancelar
                </a>
                <button type="submit" class="w-1/2 py-3 border-2 border-black bg-black text-white hover:bg-[#FF4A22] transition text-xs font-black uppercase">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
