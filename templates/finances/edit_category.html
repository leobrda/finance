<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDITAR CATEGORIA — FIN. FINANCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-[#F6F6F2] text-black min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-md border-2 sm:border-4 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] sm:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <!-- Header do Card com Quebra Suave no Mobile -->
        <div class="p-4 sm:p-6 border-b-2 sm:border-b-4 border-black bg-[#FFE600] flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <span class="text-[9px] font-black uppercase tracking-widest border border-black px-1.5 py-0.5 bg-white mb-1 inline-block">
                    Espaço: {{ workspace.name }}
                </span>
                <h1 class="text-xl sm:text-2xl font-black tracking-tighter uppercase block">
                    Editar Categoria
                </h1>
            </div>
            <a href="{% url 'manage_categories' %}?workspace={{ workspace.id }}"
               class="self-end sm:self-auto p-1.5 border-2 border-black bg-white hover:bg-black hover:text-white transition"
               title="Fechar / Voltar">
                <i data-lucide="x" class="w-4 h-4 stroke-[3]"></i>
            </a>
        </div>

        <form method="post" class="p-4 sm:p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[11px] sm:text-xs font-black uppercase tracking-wider mb-1">Nome da Categoria</label>
                <input type="text" name="name" value="{{ form.name.value|default:'' }}" required class="w-full border-2 border-black p-2.5 text-sm outline-none focus:bg-[#FFE600] font-bold uppercase transition">
            </div>

            <div>
                <label class="block text-[11px] sm:text-xs font-black uppercase tracking-wider mb-1">Tipo de Lançamento</label>
                <select name="category_type" class="w-full border-2 border-black p-2.5 text-sm outline-none bg-white font-bold cursor-pointer">
                    <option value="INCOME" {% if form.category_type.value == 'INCOME' %}selected{% endif %}>Receita (+)</option>
                    <option value="EXPENSE" {% if form.category_type.value == 'EXPENSE' %}selected{% endif %}>Despesas (-)</option>
                </select>
            </div>

            <div class="flex gap-3 pt-4 border-t-2 border-black">
                <a href="{% url 'manage_categories' %}?workspace={{ workspace.id }}" class="w-1/2 py-2.5 sm:py-3 border-2 border-black text-xs font-black uppercase text-center hover:bg-neutral-100 flex items-center justify-center transition">
                    Cancelar
                </a>
                <button type="submit" class="w-1/2 py-2.5 sm:py-3 border-2 border-black bg-black text-white hover:bg-[#FFE600] hover:text-black transition text-xs font-black uppercase shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                    Salvar
                </button>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
