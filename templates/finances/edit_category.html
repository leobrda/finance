{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDITAR CATEGORIA — FIN. FINANCE</title>

    <!-- Configurações PWA e Estética Neobrutalista -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta id="themeColorMeta" name="theme-color" content="{{ request.user.preferences.accent_primary|default:'#FFE600' }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FIN.">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap');

        :root {
            --accent-primary: {{ request.user.preferences.accent_primary|default:'#FFE600' }};
            --accent-secondary: {{ request.user.preferences.accent_secondary|default:'#FF4A22' }};
            --bg-page: #F6F6F2;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            background-color: var(--bg-page);
            color: #000000;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Classes dinâmicas de cores */
        .theme-primary-bg {
            background-color: var(--accent-primary) !important;
            color: #000000 !important;
        }
        .theme-primary-text {
            color: var(--accent-primary) !important;
        }
        .theme-secondary-bg {
            background-color: var(--accent-secondary) !important;
            color: #FFFFFF !important;
        }
        .theme-secondary-text {
            color: var(--accent-secondary) !important;
        }

        .neo-hover:hover {
            background-color: var(--accent-primary) !important;
            color: #000000 !important;
        }

        /* Regras do Modo Escuro Neobrutalista */
        body.dark-mode {
            background-color: #121212 !important;
            color: #FFFFFF !important;
        }

        body.dark-mode .bg-white {
            background-color: #1E1E1E !important;
            color: #FFFFFF !important;
        }

        body.dark-mode .border-black {
            border-color: #FFFFFF !important;
        }

        body.dark-mode input[type="text"],
        body.dark-mode select {
            background-color: #1E1E1E !important;
            color: #FFFFFF !important;
            border-color: #FFFFFF !important;
        }

        body.dark-mode input[type="text"]:focus,
        body.dark-mode select:focus {
            background-color: #2D2D2D !important;
        }

        body.dark-mode .shadow-\[4px_4px_0px_0px_rgba\(0\,0\,0\,1\)\],
        body.dark-mode .shadow-\[8px_8px_0px_0px_rgba\(0\,0\,0\,1\)\],
        body.dark-mode .shadow-\[2px_2px_0px_0px_rgba\(0\,0\,0\,1\)\] {
            box-shadow: 4px 4px 0px 0px rgba(255, 255, 255, 0.9) !important;
        }

        body.dark-mode .text-neutral-500,
        body.dark-mode .text-neutral-600 {
            color: #D4D4D8 !important;
        }
    </style>

    <!-- Injeção Imediata do Modo Noturno e Paleta Personalizada (Anti-FOUC) -->
    <script>
        (function() {
            const dbMode = "{{ request.user.preferences.theme_mode|default:'light' }}";
            const localMode = localStorage.getItem('fin_theme_mode');
            const isDark = localMode ? (localMode === 'dark') : (dbMode === 'dark');

            if (isDark) {
                document.documentElement.classList.add('dark-mode');
            }

            const savedPrimary = localStorage.getItem('fin_accent_primary') || "{{ request.user.preferences.accent_primary|default:'' }}";
            const savedSecondary = localStorage.getItem('fin_accent_secondary') || "{{ request.user.preferences.accent_secondary|default:'' }}";

            if (savedPrimary) document.documentElement.style.setProperty('--accent-primary', savedPrimary);
            if (savedSecondary) document.documentElement.style.setProperty('--accent-secondary', savedSecondary);
        })();
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="w-full max-w-md border-2 sm:border-4 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] sm:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
        <!-- Header do Card -->
        <div class="p-4 sm:p-6 border-b-2 sm:border-b-4 border-black theme-primary-bg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
                <span class="text-[9px] font-black uppercase tracking-widest border border-black px-1.5 py-0.5 bg-white text-black mb-1 inline-block">
                    Espaço: {{ workspace.name }}
                </span>
                <h1 class="text-xl sm:text-2xl font-black tracking-tighter uppercase block text-black">
                    Editar Categoria
                </h1>
            </div>
            <div class="self-end sm:self-auto flex items-center gap-2">
                <!-- Botão Alternador de Tema Escuro / Claro -->
                <button type="button" onclick="toggleDarkModeEditCategory()"
                        class="p-1.5 border-2 border-black bg-white text-black neo-hover transition flex items-center justify-center shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]"
                        title="Alternar Modo Claro / Noturno">
                    <i id="themeIconEditCategory" data-lucide="moon" class="w-4 h-4"></i>
                </button>
                <a href="{% url 'manage_categories' %}?workspace={{ workspace.id }}"
                   class="p-1.5 border-2 border-black bg-white text-black neo-hover transition shadow-[1px_1px_0px_0px_rgba(0,0,0,1)]"
                   title="Fechar / Voltar">
                    <i data-lucide="x" class="w-4 h-4 stroke-[3]"></i>
                </a>
            </div>
        </div>

        <form method="post" class="p-4 sm:p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-[11px] sm:text-xs font-black uppercase tracking-wider mb-1">Nome da Categoria</label>
                <input type="text" name="name" value="{{ form.name.value|default:'' }}" required
                       class="w-full border-2 border-black p-2.5 text-sm outline-none focus:bg-[var(--accent-primary)] focus:text-black font-bold uppercase transition">
            </div>

            <div>
                <label class="block text-[11px] sm:text-xs font-black uppercase tracking-wider mb-1">Tipo de Lançamento</label>
                <select name="category_type" class="w-full border-2 border-black p-2.5 text-sm outline-none bg-white font-bold cursor-pointer">
                    <option class="text-black bg-white" value="INCOME" {% if form.category_type.value == 'INCOME' %}selected{% endif %}>Receita (+)</option>
                    <option class="text-black bg-white" value="EXPENSE" {% if form.category_type.value == 'EXPENSE' %}selected{% endif %}>Despesas (-)</option>
                </select>
            </div>

            <div class="flex gap-3 pt-4 border-t-2 border-black">
                <a href="{% url 'manage_categories' %}?workspace={{ workspace.id }}"
                   class="w-1/2 py-2.5 sm:py-3 border-2 border-black text-xs font-black uppercase text-center neo-hover flex items-center justify-center transition">
                    Cancelar
                </a>
                <button type="submit"
                        class="w-1/2 py-2.5 sm:py-3 border-2 border-black bg-black text-white hover:theme-primary-bg hover:!text-black transition text-xs font-black uppercase shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                    Salvar
                </button>
            </div>
        </form>
    </div>

    <!-- Motor de Tema e Sincronização no Backend -->
    <script>
        function syncThemeWithBackend(isDark) {
            const primary = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim();
            const secondary = getComputedStyle(document.documentElement).getPropertyValue('--accent-secondary').trim();
            const mode = isDark ? 'dark' : 'light';

            fetch("{% url 'update_theme_preferences' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    accent_primary: primary,
                    accent_secondary: secondary,
                    theme_mode: mode
                })
            }).catch(err => console.error("Erro ao sincronizar tema:", err));
        }

        function applyEditCategoryTheme(isDark) {
            const metaTheme = document.getElementById('themeColorMeta');
            const themeIcon = document.getElementById('themeIconEditCategory');
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim() || '#FFE600';

            if (isDark) {
                document.body.classList.add('dark-mode');
                if (metaTheme) metaTheme.setAttribute('content', '#121212');
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.body.classList.remove('dark-mode');
                if (metaTheme) metaTheme.setAttribute('content', primaryColor);
                if (themeIcon) themeIcon.setAttribute('data-lucide', 'moon');
            }

            lucide.createIcons();
        }

        function toggleDarkModeEditCategory() {
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            const nextModeIsDark = !isCurrentlyDark;
            localStorage.setItem('fin_theme_mode', nextModeIsDark ? 'dark' : 'light');
            applyEditCategoryTheme(nextModeIsDark);
            syncThemeWithBackend(nextModeIsDark);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('fin_theme_mode');
            const dbTheme = "{{ request.user.preferences.theme_mode|default:'light' }}";
            const initialMode = savedTheme ? (savedTheme === 'dark') : (dbTheme === 'dark');
            applyEditCategoryTheme(initialMode);
            lucide.createIcons();
        });
    </script>

    <!-- Registro do Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('FIN. PWA ativo com escopo:', reg.scope))
                    .catch((err) => console.error('Falha ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
