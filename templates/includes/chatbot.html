<!-- Widget de Suporte Neobrutalista — FIN. BOT -->
<div id="finChatWidget" class="fixed bottom-5 right-5 z-50 flex flex-col items-end font-sans">

    <!-- Janela de Conversa (Card Neobrutalista) -->
    <div id="finChatWindow"
         class="hidden w-[90vw] sm:w-[380px] max-h-[520px] bg-white border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex flex-col mb-3 transition-all duration-150 overflow-hidden">

        <!-- Topo da Janela -->
        <div class="p-3.5 border-b-4 border-black bg-[#FFE600] text-black flex justify-between items-center select-none">
            <div class="flex items-center gap-2">
                <span class="p-1 border-2 border-black bg-black text-[#FFE600] flex items-center justify-center">
                    <i data-lucide="bot" class="w-4 h-4 stroke-[2.5]"></i>
                </span>
                <div>
                    <h4 class="text-xs font-black uppercase tracking-wider block">FIN. ASSISTENTE</h4>
                    <span class="text-[9px] font-mono font-bold uppercase tracking-widest text-black/75 block">Central de Ajuda Rápida</span>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="restartChatBot()"
                        class="p-1 border-2 border-black bg-white hover:bg-black hover:text-white transition"
                        title="Reiniciar Atendimento">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                </button>
                <button type="button" onclick="toggleChatBot()"
                        class="p-1 border-2 border-black bg-white hover:bg-[#FF4A22] hover:text-white transition"
                        title="Fechar">
                    <i data-lucide="x" class="w-3.5 h-3.5 stroke-[3]"></i>
                </button>
            </div>
        </div>

        <!-- Área de Mensagens com Rolagem -->
        <div id="finChatMessages" class="p-4 overflow-y-auto space-y-3 max-h-[360px] bg-[#F6F6F2] dark:bg-[#1E1E1E] text-xs">
            <!-- As mensagens e opções são geradas dinamicamente via JS -->
        </div>

        <!-- Barra Inferior de Status -->
        <div class="p-2 border-t-2 border-black bg-white dark:bg-[#121212] flex justify-between items-center text-[10px] font-mono font-bold uppercase text-neutral-500">
            <span>● Resposta Instantânea</span>
            <span class="border border-black px-1.5 py-0.2 bg-stone-100 dark:bg-[#282828] text-black dark:text-white">FIN. v1.0</span>
        </div>
    </div>

    <!-- Botão Flutuante Disparador (Toggle) -->
    <button type="button" id="finChatToggleBtn" onclick="toggleChatBot()"
            style="color: #000000 !important; background-color: #FFE600 !important;"
            class="p-3.5 sm:px-4 sm:py-3 border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] transition-all flex items-center gap-2 group cursor-pointer"
            title="Dúvidas e Suporte">
        <i data-lucide="help-circle" class="w-6 h-6 sm:w-5 sm:h-5 stroke-[2.5] text-black"></i>
        <span class="hidden sm:inline font-black text-xs uppercase tracking-wider text-black">Ajuda & Dúvidas</span>
    </button>
</div>

<!-- Lógica do Chatbot Baseado em Árvore de Decisão -->
<script>
    const chatTree = {
        inicio: {
            mensagem: "E aí! 👋 Sou o assistente do <strong>FIN. FINANCE</strong>. Como posso te ajudar hoje?",
            opcoes: [
                { texto: "📦 Planos & Limites do Sistema", proximo: "planos" },
                { texto: "🔁 Como funciona o Parcelamento?", proximo: "parcelamento" },
                { texto: "⚡ Assinaturas com Auto-Baixa", proximo: "assinaturas" },
                { texto: "📱 Instalar app no Celular (PWA)", proximo: "pwa" },
                { texto: "💬 Falar no WhatsApp", proximo: "whatsapp" }
            ]
        },
        planos: {
            mensagem: "Temos 3 modalidades pensadas para cada momento:<br><br>" +
                      "• <strong>GRATUITO:</strong> 1 Espaço, até 30 transações/mês, 8 categorias e 1 exportação.<br>" +
                      "• <strong>MENSAL PRO (R$ 9,90):</strong> 3 Espaços, até 45 transações/mês, 12 categorias, 2 exportações e personalização de cores.<br>" +
                      "• <strong>ANUAL PRO (R$ 79,90):</strong> Tudo <strong>ILIMITADO</strong> com 35% de economia!",
            opcoes: [
                { texto: "Como faço para mudar de plano?", proximo: "upgrade_passo" },
                { texto: "« Voltar ao início", proximo: "inicio" }
            ]
        },
        upgrade_passo: {
            mensagem: "Para fazer upgrade ou trocar de plano:<br><br>" +
                      "Basta clicar no botão <strong>UPGRADE</strong> no cabeçalho ou acessar a página de planos. O acesso às novas cotas e recursos é liberado instantaneamente!",
            opcoes: [
                { texto: "« Voltar ao início", proximo: "inicio" }
            ]
        },
        parcelamento: {
            mensagem: "Ao cadastrar um lançamento, no bloco <strong>Parcelamento da Compra</strong>:<br><br>" +
                      "1. Informe o número de parcelas (ex: 12x).<br>" +
                      "2. Escolha se o valor digitado é o total ou o valor de cada parcela.<br>" +
                      "O sistema cria as parcelas dos próximos meses automaticamente como 'Pendentes', com ajuste exato de centavos!",
            opcoes: [
                { texto: "Entendi, valeu!", proximo: "inicio" }
            ]
        },
        assinaturas: {
            mensagem: "No botão <strong>Assinaturas</strong> do painel, você cadastra gastos fixos mensais (como internet, Spotify ou fornecedores).<br><br>" +
                      "Se ativar <strong>Baixa Automática</strong>, o FIN. cria o lançamento mensal e altera para 'Pago' assim que o dia do vencimento chegar!",
            opcoes: [
                { texto: "« Voltar ao início", proximo: "inicio" }
            ]
        },
        pwa: {
            mensagem: "O FIN. funciona como aplicativo nativo!<br><br>" +
                      "• <strong>No iPhone (Safari):</strong> Toque no botão Compartilhar (quadrado com seta) e escolha <i>'Adicionar à Tela de Início'</i>.<br>" +
                      "• <strong>No Android (Chrome):</strong> Toque nos 3 pontinhos e escolha <i>'Instalar aplicativo'</i>.",
            opcoes: [
                { texto: "« Voltar ao início", proximo: "inicio" }
            ]
        },
        whatsapp: {
            mensagem: "Precisa de ajuda humana ou suporte individual? Fale diretamente com a gente:",
            opcoes: [
                { texto: "👉 Abrir conversa no WhatsApp", link: "https://wa.me/5518999999999?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20com%20o%20FIN.%20Finance" },
                { texto: "« Voltar ao início", proximo: "inicio" }
            ]
        }
    };

    function toggleChatBot() {
        const win = document.getElementById('finChatWindow');
        const isOpen = !win.classList.contains('hidden');
        if (isOpen) {
            win.classList.add('hidden');
        } else {
            win.classList.remove('hidden');
            const container = document.getElementById('finChatMessages');
            if (container.children.length === 0) {
                renderChatNode('inicio');
            }
        }
    }

    function restartChatBot() {
        const container = document.getElementById('finChatMessages');
        container.innerHTML = '';
        renderChatNode('inicio');
    }

    function renderChatNode(nodeKey) {
        const node = chatTree[nodeKey];
        if (!node) return;

        const container = document.getElementById('finChatMessages');

        // Cria a bolha de mensagem do bot
        const botMsg = document.createElement('div');
        botMsg.className = "p-3 border-2 border-black bg-white dark:bg-[#282828] text-black dark:text-white font-bold shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] leading-relaxed";
        botMsg.innerHTML = node.mensagem;
        container.appendChild(botMsg);

        // Remove blocos de opções anteriores para não poluir
        const oldOptions = container.querySelectorAll('.bot-option-group');
        oldOptions.forEach(el => el.remove());

        // Cria o grupo de botões/opções
        const optGroup = document.createElement('div');
        optGroup.className = "bot-option-group space-y-1.5 pt-1";

        node.opcoes.forEach(opt => {
            if (opt.link) {
                const a = document.createElement('a');
                a.href = opt.link;
                a.target = "_blank";
                a.className = "block w-full text-left p-2.5 border-2 border-black bg-[#FFE600] text-black hover:bg-black hover:text-white transition font-black uppercase text-[11px] shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
                a.innerHTML = opt.texto;
                optGroup.appendChild(a);
            } else {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = "block w-full text-left p-2.5 border-2 border-black bg-white dark:bg-[#1E1E1E] text-black dark:text-white hover:bg-[#FFE600] hover:text-black dark:hover:bg-[#FFE600] dark:hover:text-black transition font-black uppercase text-[11px] shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
                btn.innerHTML = opt.texto;
                btn.onclick = () => {
                    // Adiciona a escolha do usuário como mensagem no histórico
                    const userMsg = document.createElement('div');
                    userMsg.className = "p-2.5 border-2 border-black bg-black text-white font-black uppercase text-[11px] text-right self-end shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]";
                    userMsg.innerText = opt.texto;
                    container.appendChild(userMsg);
                    optGroup.remove();

                    // Renderiza o próximo passo com um leve delay natural
                    setTimeout(() => {
                        renderChatNode(opt.proximo);
                    }, 120);
                };
                optGroup.appendChild(btn);
            }
        });

        container.appendChild(optGroup);
        container.scrollTop = container.scrollHeight;
        lucide.createIcons();
    }
</script>
