<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - Gestão Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Recuperar Senha</h2>

        {% if submitted and reset_url %}
            <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg mb-6">
                <p class="text-sm font-semibold mb-2">Link gerado com sucesso!</p>
                <p class="text-xs mb-3 text-emerald-700">Clique abaixo para definir sua nova senha agora:</p>
                <a href="{{ reset_url }}"
                   class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
                    Redefinir Senha Agora
                </a>
            </div>
        {% elif submitted and not user_found %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-lg text-sm mb-4">
                Nenhum usuário encontrado com este e-mail.
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Informe seu E-mail Cadastrado</label>
                <input type="email" name="email" required
                       class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="seuemail@exemplo.com">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
                Gerar Link de Redefinição
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Lembrou da senha? <a href="{% url 'login' %}" class="text-indigo-600 underline">Voltar para o Login</a>
        </p>
    </div>
</body>
</html>
