<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestão Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Acessar Sistema</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">
                Entrar
            </button>

            <div class="text-right mt-2">
                <a href="{% url 'password_reset_request' %}" class="text-xs text-gray-500 hover:text-indigo-600 underline">
                    Esqueceu sua senha?
                </a>
            </div>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">
            Não possui conta? <a href="{% url 'register' %}" class="text-emerald-600 underline">Cadastre-se</a>
        </p>
    </div>
</body>
</html>
