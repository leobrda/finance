<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>NOVO CADASTRO — FIN. FINANCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-[#F6F6F2] text-black min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md border-4 border-black bg-white shadow-[10px_10px_0px_0px_rgba(0,0,0,1)]">
        <div class="p-6 border-b-4 border-black bg-[#FF4A22] text-white flex justify-between items-center">
            <span class="text-3xl font-black tracking-tighter uppercase">FIN.</span>
            <span class="text-xs font-black uppercase tracking-widest border-2 border-black px-2 py-0.5 bg-white text-black">CADASTRO</span>
        </div>

        <div class="p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-1">Nome</label>
                    <input type="text" name="first_name" required class="w-full border-2 border-black p-3 text-sm outline-none focus:bg-[#FFE600] font-bold">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-1">Nome de Usuário</label>
                    <input type="text" name="username" required class="w-full border-2 border-black p-3 text-sm outline-none focus:bg-[#FFE600] font-bold">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-1">E-mail</label>
                    <input type="email" name="email" required class="w-full border-2 border-black p-3 text-sm outline-none focus:bg-[#FFE600] font-bold">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-1">Senha</label>
                    <input type="password" name="password1" required class="w-full border-2 border-black p-3 text-sm outline-none focus:bg-[#FFE600] font-bold">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-1">Confirmar Senha</label>
                    <input type="password" name="password2" required class="w-full border-2 border-black p-3 text-sm outline-none focus:bg-[#FFE600] font-bold">
                </div>

                {% if form.errors %}
                    <div class="border-2 border-black bg-[#FF4A22] text-white p-3 text-xs font-bold uppercase">
                        {{ form.errors }}
                    </div>
                {% endif %}

                <button type="submit" class="w-full py-4 bg-[#FFE600] hover:bg-black hover:text-white transition border-2 border-black text-xs font-black uppercase tracking-widest mt-2">
                    Criar Conta e Espaços →
                </button>
            </form>

            <div class="mt-6 pt-4 border-t-2 border-black text-center text-xs font-bold uppercase">
                Já tem conta criada? <a href="{% url 'login' %}" class="underline hover:text-[#FF4A22]">Iniciar Sessão</a>
            </div>
        </div>
    </div>
</body>
</html>
