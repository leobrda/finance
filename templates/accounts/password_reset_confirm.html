<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Senha - Gestão Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Criar Nova Senha</h2>
        {% if validlink %}
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">
                    Atualizar Senha
                </button>
            </form>
        {% else %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-lg text-sm text-center">
                Este link de redefinição expirou ou é inválido.
            </div>
            <a href="{% url 'password_reset_request' %}" class="block text-center text-sm text-indigo-600 mt-4 underline">
                Solicitar um novo link
            </a>
        {% endif %}
    </div>
</body>
</html>
